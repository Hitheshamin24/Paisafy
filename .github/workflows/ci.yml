name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Python ML Server Tests ────────────────────────────────────────────────
  python-tests:
    name: Python Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r ml-server/requirements.txt

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest ml-server/tests/ -v --tb=short

  # ── Node.js Backend Tests ─────────────────────────────────────────────────
  node-tests:
    name: Node Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run Jest tests
        run: npm test
        working-directory: backend
        env:
          NODE_ENV: test
          FLASK_URL: http://localhost:8000
